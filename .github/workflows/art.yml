name: Art Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 17 * * *"

# Autoriser le workflow à modifier les fichiers du dépôt
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # v4 est recommandé

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          cd art
          pip install tweepy requests Pillow

      - name: Run bot
        run: |
          cd art
          python art.py
        env:
          2LART_CONSUMER_KEY: ${{ secrets.ART_CONSUMER_KEY }}
          2LART_CONSUMER_SECRET: ${{ secrets.ART_CONSUMER_SECRET }}
          2LART_ACCESS_KEY: ${{ secrets.ART_ACCESS_KEY }}
          2LART_ACCESS_SECRET: ${{ secrets.ART_ACCESS_SECRET }}

      # Nouvelle étape pour sauvegarder le nouvel index sur GitHub
      - name: Sauvegarder l'index
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add art/index.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour de l'index" && git push)
