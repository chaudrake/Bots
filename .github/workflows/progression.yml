# lancé par cron-job.org
name: Progression Année

on:
 # schedule:
 #   - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install tweepy

      - name: Execute script
        env:
          PROGRESSION_ACCESS_KEY: ${{ secrets.PROGRESSION_ACCESS_KEY }}
          PROGRESSION_ACCESS_SECRET: ${{ secrets.PROGRESSION_ACCESS_SECRET }}
          PROGRESSION_CONSUMER_KEY: ${{ secrets.PROGRESSION_CONSUMER_KEY }}
          PROGRESSION_CONSUMER_SECRET: ${{ secrets.PROGRESSION_CONSUMER_SECRET }}
        run: python progression/progression.py
