# Le script se declenche avec un cron sur cron-jobs.org
name: Mur Des Cons Bot

on:
  workflow_dispatch:
#  schedule:
    # Chaque heure de 9h à 19h UTC (9h, 10h, 11h, 12h, 13h, 14h, 15h, 16h, 17h, 18h, 19h)
#    - cron: "59 9-19 * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # Autorise le bot à modifier les fichiers du dépôt
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          cd Murdescons
          pip install tweepy

      - name: Run bot
        run: |
          cd Murdescons
          python murdescons.py
        env:
          MURDESCONS_CONSUMER_KEY: ${{ secrets.MURDESCONS_CONSUMER_KEY }}
          MURDESCONS_CONSUMER_SECRET: ${{ secrets.MURDESCONS_CONSUMER_SECRET }}
          MURDESCONS_ACCESS_TOKEN: ${{ secrets.MURDESCONS_ACCESS_TOKEN }}
          MURDESCONS_ACCESS_TOKEN_SECRET: ${{ secrets.MURDESCONS_ACCESS_TOKEN_SECRET }}

      - name: Save History Update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # On cible le fichier de suivi dans le bon dossier
          git add Murdescons/tweeted.txt
          # On commit et on push seulement s'il y a eu un changement (8% de chance selon ton script)
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 MurDesCons: Mise à jour de la liste des tweetés" && git push)
          
