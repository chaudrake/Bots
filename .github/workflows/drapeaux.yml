name: Drapeaux Bot

on:
  workflow_dispatch:
  schedule:
    # Tous les jours à 09h et 15h UTC (11h et 17h en France l'été)
    - cron: "0 9 * * *"
    - cron: "0 15 * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # INDISPENSABLE : Autorise le bot à sauvegarder l'index des drapeaux utilisés
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          cd drapeaux
          pip install requests tweepy tracery colorama python-dotenv

      - name: Run bot
        run: |
          cd drapeaux
          python drapeaux.py
        env:
          DRAPEAUX_CONSUMER_KEY: ${{ secrets.DRAPEAUX_CONSUMER_KEY }}
          DRAPEAUX_CONSUMER_SECRET: ${{ secrets.DRAPEAUX_CONSUMER_SECRET }}
          DRAPEAUX_ACCESS_TOKEN: ${{ secrets.DRAPEAUX_ACCESS_TOKEN }}
          DRAPEAUX_ACCESS_TOKEN_SECRET: ${{ secrets.DRAPEAUX_ACCESS_TOKEN_SECRET }}

   - name: Save index update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          BACKUP_FILE="/tmp/index_backup_${{ github.run_id }}.json"
          MAX_RETRIES=3
          RETRY_COUNT=0
          SUCCESS=false
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$SUCCESS" = false ]; do
            echo "Tentative $((RETRY_COUNT+1)) sur $MAX_RETRIES..."
            
            if [ -f drapeaux/index.json ]; then
              cp drapeaux/index.json "$BACKUP_FILE"
            fi
            
            git fetch origin main
            git reset --hard origin/main
            
            if [ -f "$BACKUP_FILE" ]; then
              cp "$BACKUP_FILE" drapeaux/index.json
            fi
            
            git add drapeaux/index.json
            if git diff --quiet --cached; then
              echo "Aucun changement à committer"
              SUCCESS=true
            else
              if git commit -m "🤖 Drapeaux : Mise à jour de l'index"; then
                if git push origin main; then
                  echo "Commit et push réussis"
                  SUCCESS=true
                else
                  echo "Push échoué, tentative de récupération..."
                  git pull --rebase origin main
                  RETRY_COUNT=$((RETRY_COUNT+1))
                  if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                    echo "Attente de 60 secondes avant nouvelle tentative..."
                    sleep 60
                  fi
                fi
              else
                echo "Commit échoué (pas de changement?)"
                SUCCESS=true
              fi
            fi
          done
          
          if [ "$SUCCESS" = false ]; then
            echo "❌ Échec après $MAX_RETRIES tentatives"
            exit 1
          fi
