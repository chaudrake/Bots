name: Drapeaux Bot

on:
  workflow_dispatch:
  schedule:
    # Tous les jours à 09h et 15h UTC (11h et 17h en France l'été)
    - cron: "0 9 * * *"
    - cron: "0 15 * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # INDISPENSABLE : Autorise le bot à sauvegarder l'index des drapeaux utilisés
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          cd drapeaux
          pip install requests tweepy tracery colorama python-dotenv

      - name: Run bot
        run: |
          cd drapeaux
          python drapeaux.py
        env:
          DRAPEAUX_CONSUMER_KEY: ${{ secrets.DRAPEAUX_CONSUMER_KEY }}
          DRAPEAUX_CONSUMER_SECRET: ${{ secrets.DRAPEAUX_CONSUMER_SECRET }}
          DRAPEAUX_ACCESS_TOKEN: ${{ secrets.DRAPEAUX_ACCESS_TOKEN }}
          DRAPEAUX_ACCESS_TOKEN_SECRET: ${{ secrets.DRAPEAUX_ACCESS_TOKEN_SECRET }}

      - name: Save index update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add drapeaux/drapeaux.json
          git add drapeaux/bot.log
          # On vérifie s'il y a eu un changement
          if ! git diff --quiet --staged; then
            git commit -m "🤖 Maires : Mise à jour de la liste"
            # SÉCURITÉ : On récupère les modifs des autres bots avant de pousser
            git pull --rebase origin main
            git push
          fi
