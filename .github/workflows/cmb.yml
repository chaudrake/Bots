name: CMB Bot Schedule

on:
  schedule:
    # Toutes les 4 heures entre 5h et 20h UTC
    - cron: '0 5,9,13,17,21 * * *'
  workflow_dispatch:

jobs:
  tweet:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install tweepy python-dotenv

      - name: Run bot
        env:
          CMB_ACCESS_KEY: ${{ secrets.CMB_ACCESS_KEY }}
          CMB_ACCESS_SECRET: ${{ secrets.CMB_ACCESS_SECRET }}
          CMB_CONSUMER_KEY: ${{ secrets.CMB_CONSUMER_KEY }}
          CMB_CONSUMER_SECRET: ${{ secrets.CMB_CONSUMER_SECRET }}
        # On précise qu'on travaille dans le dossier cmb
        run: python cmb.py
        working-directory: ./cmb

      - name: Save history update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cmb/last_index.json
          git add cmb/log_bot_qualites.log
          # On vérifie s'il y a eu un changement
          if ! git diff --quiet --staged; then
            git commit -m "🤖 CMB: Mise à jour de la liste"
            # SÉCURITÉ : On récupère les modifs des autres bots avant de pousser
            git pull --rebase origin main
            git push
          fi
