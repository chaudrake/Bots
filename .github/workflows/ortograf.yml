name: Ortograf Bot

on:
  workflow_dispatch:
  schedule:
    # Tous les jours à 09h UTC (11h en France été)
    - cron: "59 8 * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # INDISPENSABLE : Autorise le bot à mettre à jour l'index sur ton dépôt
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          cd ortograf
          pip install tweepy

      - name: Run bot
        run: |
          cd ortograf
          python ortograf.py
        env:
          ORTOGRAF_CONSUMER_KEY: ${{ secrets.ORTOGRAF_CONSUMER_KEY }}
          ORTOGRAF_CONSUMER_SECRET: ${{ secrets.ORTOGRAF_CONSUMER_SECRET }}
          ORTOGRAF_ACCESS_KEY: ${{ secrets.ORTOGRAF_ACCESS_KEY }}
          ORTOGRAF_ACCESS_SECRET: ${{ secrets.ORTOGRAF_ACCESS_SECRET }}

      - name: Save index update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # D'abord, récupérer les changements distants
          git fetch origin main
          
          # Vérifier si index.txt a changé
          if git diff --quiet HEAD -- ortograf/index.txt; then
            echo "Aucun changement à pousser"
          else
            # Commit des changements locaux
            git add ortograf/index.txt
            git commit -m "🤖 Ortograf: Mise à jour de l'index"
            
            # Ensuite, rebaser ou merger en douceur
            git pull --rebase origin main || git pull origin main --no-rebase
            
            # Enfin, pousser
            git push origin main
          fi
