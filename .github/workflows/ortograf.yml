name: Ortograf Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"   # tous les jours à 09h UTC (11h en France été)

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          cd ortograf
          pip install tweepy

      - name: Debug files
        run: |
          echo "=== ortograf directory content ==="
          ls -la ortograf/
          echo "=== Check liste.txt (first 5 lines) ==="
          head -10 ortograf/liste.txt
          echo "=== Check index.txt ==="
          cat ortograf/index.txt 2>/dev/null || echo "index.txt n'existe pas encore"

      - name: Run bot
        run: |
          cd ortograf
          python ortograf.py
        env:
          ORTOGRAF_CONSUMER_KEY: ${{ secrets.ORTOGRAF_CONSUMER_KEY }}
          ORTOGRAF_CONSUMER_SECRET: ${{ secrets.ORTOGRAF_CONSUMER_SECRET }}
          ORTOGRAF_ACCESS_KEY: ${{ secrets.ORTOGRAF_ACCESS_KEY }}
          ORTOGRAF_ACCESS_SECRET: ${{ secrets.ORTOGRAF_ACCESS_SECRET }}
