name: Ortograf Bot

on:
  workflow_dispatch:
  schedule:
    # Tous les jours à 09h UTC (11h en France été)
    - cron: "0 9 * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # INDISPENSABLE : Autorise le bot à mettre à jour l'index sur ton dépôt
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          cd ortograf
          pip install tweepy

      - name: Run bot
        run: |
          cd ortograf
          python ortograf.py
        env:
          ORTOGRAF_CONSUMER_KEY: ${{ secrets.ORTOGRAF_CONSUMER_KEY }}
          ORTOGRAF_CONSUMER_SECRET: ${{ secrets.ORTOGRAF_CONSUMER_SECRET }}
          ORTOGRAF_ACCESS_KEY: ${{ secrets.ORTOGRAF_ACCESS_KEY }}
          ORTOGRAF_ACCESS_SECRET: ${{ secrets.ORTOGRAF_ACCESS_SECRET }}

      - name: Save index update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # On cible l'index dans le dossier ortograf
          git add ortograf/index.txt
          # Le script a 30% de chance de s'exécuter, on ne push que s'il y a un changement
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Ortograf: Mise à jour de l'index" && git push)
          
