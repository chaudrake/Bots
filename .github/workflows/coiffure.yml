name: Coiffure Imagina Tiff

on:
  workflow_dispatch:
  schedule:
    # 15h UTC = 17h FR (été) / 16h FR (hiver)
    - cron: "59 14 * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # Ajout explicite des permissions pour permettre le push de l'index
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          cd coiffure
          pip install tweepy pytz

      - name: Run bot
        run: |
          cd coiffure
          python coiffure.py
        env:
          COIFFURE_CONSUMER_KEY: ${{ secrets.COIFFURE_CONSUMER_KEY }}
          COIFFURE_CONSUMER_SECRET: ${{ secrets.COIFFURE_CONSUMER_SECRET }}
          COIFFURE_ACCESS_KEY: ${{ secrets.COIFFURE_ACCESS_KEY }}
          COIFFURE_ACCESS_SECRET: ${{ secrets.COIFFURE_ACCESS_SECRET }}

      - name: Save index update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          BACKUP_FILE="/tmp/index_backup_${{ github.run_id }}.json"
          MAX_RETRIES=3
          RETRY_COUNT=0
          SUCCESS=false
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$SUCCESS" = false ]; do
            echo "Tentative $((RETRY_COUNT+1)) sur $MAX_RETRIES..."
            
            if [ -f coiffure/index.txt ]; then
              cp coiffure/index.txt "$BACKUP_FILE"
            fi
            
            git fetch origin main
            git reset --hard origin/main
            
            if [ -f "$BACKUP_FILE" ]; then
              cp "$BACKUP_FILE" coiffure/index.txt
            fi
            
            git add coiffure/index.txt
            if git diff --quiet --cached; then
              echo "Aucun changement à committer"
              SUCCESS=true
            else
              if git commit -m "🤖 Coiffure : Mise à jour de l'index"; then
                if git push origin main; then
                  echo "Commit et push réussis"
                  SUCCESS=true
                else
                  echo "Push échoué, tentative de récupération..."
                  git pull --rebase origin main
                  RETRY_COUNT=$((RETRY_COUNT+1))
                  if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                    echo "Attente de 60 secondes avant nouvelle tentative..."
                    sleep 60
                  fi
                fi
              else
                echo "Commit échoué (pas de changement?)"
                SUCCESS=true
              fi
            fi
          done
          
          if [ "$SUCCESS" = false ]; then
            echo "❌ Échec après $MAX_RETRIES tentatives"
            exit 1
          fi
