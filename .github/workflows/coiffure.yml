name: Coiffure Bot

on:
  workflow_dispatch:
  schedule:
    # 17h00 heure française
    # Été: 15h00 UTC, Hiver: 16h00 UTC
    # On met le cron à 15h00 UTC et on ajuste avec sleep
    - cron: "0 15 * * *"     # 15h00 UTC

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          cd coiffure
          pip install tweepy pytz

      - name: Debug files
        run: |
          echo "=== coiffure directory content ==="
          ls -la coiffure/
          echo "=== Check liste.txt (first 5 lines) ==="
          head -10 coiffure/liste.txt
          echo "=== Check index.txt ==="
          cat coiffure/index.txt 2>/dev/null || echo "index.txt n'existe pas encore"

      - name: Run bot
        run: |
          cd coiffure
          python coiffure.py
        env:
          COIFFURE_CONSUMER_KEY: ${{ secrets.COIFFURE_CONSUMER_KEY }}
          COIFFURE_CONSUMER_SECRET: ${{ secrets.COIFFURE_CONSUMER_SECRET }}
          COIFFURE_ACCESS_KEY: ${{ secrets.COIFFURE_ACCESS_KEY }}
          COIFFURE_ACCESS_SECRET: ${{ secrets.COIFFURE_ACCESS_SECRET }}
