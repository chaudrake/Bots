name: Coiffure Imagina Tiff

on:
  workflow_dispatch:
  schedule:
    # 15h UTC = 17h FR (été) / 16h FR (hiver)
    - cron: "59 14 * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # Ajout explicite des permissions pour permettre le push de l'index
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          cd coiffure
          pip install tweepy pytz

      - name: Run bot
        run: |
          cd coiffure
          python coiffure.py
        env:
          COIFFURE_CONSUMER_KEY: ${{ secrets.COIFFURE_CONSUMER_KEY }}
          COIFFURE_CONSUMER_SECRET: ${{ secrets.COIFFURE_CONSUMER_SECRET }}
          COIFFURE_ACCESS_KEY: ${{ secrets.COIFFURE_ACCESS_KEY }}
          COIFFURE_ACCESS_SECRET: ${{ secrets.COIFFURE_ACCESS_SECRET }}

      - name: Save index update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add coiffure/index.txt
          # Vérification de changement avant commit pour éviter les erreurs inutiles
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Mise à jour automatique de l'index" && git push)
          
      - name: Save history update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add coiffure/index.txt
          git add coiffure/log.log
          # On vérifie s'il y a eu un changement
          if ! git diff --quiet --staged; then
            git commit -m "🤖 Coiffure : Mise à jour de la liste"
            # SÉCURITÉ : On récupère les modifs des autres bots avant de pousser
            git pull --rebase origin main
            git push
          fi
