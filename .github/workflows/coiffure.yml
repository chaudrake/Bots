name: Coiffure Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * *"   # 15h UTC = 17h FR (été) / 16h FR (hiver)

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          cd coiffure
          pip install tweepy pytz
      - name: Run bot
        run: |
          cd coiffure
          python coiffure.py
        env:
          COIFFURE_CONSUMER_KEY: ${{ secrets.COIFFURE_CONSUMER_KEY }}
          COIFFURE_CONSUMER_SECRET: ${{ secrets.COIFFURE_CONSUMER_SECRET }}
          COIFFURE_ACCESS_KEY: ${{ secrets.COIFFURE_ACCESS_KEY }}
          COIFFURE_ACCESS_SECRET: ${{ secrets.COIFFURE_ACCESS_SECRET }}
