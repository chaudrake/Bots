name: Sauvegarde Automatique sur Google Drive

on:
  schedule:
    # S'exécute à 03:00 tous les jours (le script filtrera les jours autorisés)
    - cron: '0 3 * * *'
  workflow_dispatch: # Permet de lancer manuellement la sauvegarde depuis GitHub

jobs:
  backup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install PyDrive2

      - name: Lancer le script de sauvegarde
        env:
          GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        # On lance le script depuis la racine du dépôt
        run: python sauvegardes/sauvegardesurdrive.py
        
