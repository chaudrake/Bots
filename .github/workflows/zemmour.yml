name: ZemmourBot

on:
  schedule:
    # Déclenchements à 08:00 et 15:00 UTC
    - cron: '0 8,15 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install tweepy

      - name: Run bot
        env:
          ZEMMOUR_CONSUMER_KEY: ${{ secrets.ZEMMOUR_CONSUMER_KEY }}
          ZEMMOUR_CONSUMER_SECRET: ${{ secrets.ZEMMOUR_CONSUMER_SECRET }}
          ZEMMOUR_ACCESS_TOKEN: ${{ secrets.ZEMMOUR_ACCESS_TOKEN }}
          ZEMMOUR_ACCESS_TOKEN_SECRET: ${{ secrets.ZEMMOUR_ACCESS_TOKEN_SECRET }}
        run: python zemmour/zemmour.py

      - name: Update Repository (Index)
        run: |
          [span_2](start_span)git config --global user.name "github-actions[bot]"[span_2](end_span)
          [span_3](start_span)git config --global user.email "github-actions[bot]@users.noreply.github.com"[span_3](end_span)
          
          # 1. On prépare le fichier modifié
          [span_4](start_span)git add zemmour/index.json[span_4](end_span)
          
          # 2. On vérifie s'il y a des changements à enregistrer
          [span_5](start_span)if ! git diff --cached --quiet; then[span_5](end_span)
            # 3. On commit les changements localement pour "nettoyer" le répertoire
            [span_6](start_span)git commit -m "Update index [skip ci]"[span_6](end_span)
            
            # 4. Maintenant on peut faire le pull rebase sans erreur
            [span_7](start_span)git pull --rebase origin main[span_7](end_span)
            
            # 5. On envoie vers GitHub
            [span_8](start_span)git push[span_8](end_span)
          else
            echo "Aucun changement détecté dans l'index."
          fi
