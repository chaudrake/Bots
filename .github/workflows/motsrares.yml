name: Mots Rares Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          cd motsrares
          pip install tweepy

      - name: Debug files
        run: |
          echo "=== motsrares directory content ==="
          ls -la motsrares/
          echo "=== Check motsrares.txt ==="
          head -5 motsrares/motsrares.txt

      - name: Run bot
        run: |
          cd motsrares
          python motsrares.py
        env:
          MOTSRARES_CONSUMER_KEY: ${{ secrets.MOTSRARES_CONSUMER_KEY }}
          MOTSRARES_CONSUMER_SECRET: ${{ secrets.MOTSRARES_CONSUMER_SECRET }}
          MOTSRARES_ACCESS_KEY: ${{ secrets.MOTSRARES_ACCESS_KEY }}
          MOTSRARES_ACCESS_SECRET: ${{ secrets.MOTSRARES_ACCESS_SECRET }}
