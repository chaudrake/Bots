name: Mots Rares Bot

on:
  schedule:
    # Ton cron d'origine
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          # Indispensable pour permettre le rebase
          fetch-depth: 0

      - name: Configurer Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Exécuter le script
        run: python motsrares/motsrares.py

      - name: Configurer l'identité Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit et Push des modifications
        run: |
          git add motsrares/indexmotsrares.txt
          # On vérifie s'il y a des changements pour éviter une erreur sur commit vide
          if ! git diff --cached --exit-code; then
            git commit -m "🤖 Mots Rares: Mise à jour de l'index"
            # On récupère les changements distants et on place notre commit après
            git pull --rebase origin main
            git push origin main
          else
            echo "Aucun nouveau mot rare trouvé."
          fi
          
