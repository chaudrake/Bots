name: Mots Rares Bot

on:
  schedule:
    - cron: "55 8 * * *"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurer Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 tweepy
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Exécuter le script
        env:
          MOTSRARES_ACCESS_KEY: ${{ secrets.MOTSRARES_ACCESS_KEY }}
          MOTSRARES_ACCESS_SECRET: ${{ secrets.MOTSRARES_ACCESS_SECRET }}
          MOTSRARES_CONSUMER_KEY: ${{ secrets.MOTSRARES_CONSUMER_KEY }}
          MOTSRARES_CONSUMER_SECRET: ${{ secrets.MOTSRARES_CONSUMER_SECRET }}
        run: python motsrares/motsrares.py

      - name: Commit et Push des modifications
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add motsrares/indexmotsrares.txt
          
          if ! git diff --cached --quiet; then
            git pull --rebase origin main
            git commit -m "🤖 Mots Rares: Mise à jour de l'index"
            git push origin main
          else
            echo "Aucun changement à pousser"
          fi
