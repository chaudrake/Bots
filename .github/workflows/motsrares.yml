name: Mots Rares Bot

on:
  schedule:
    # Ton cron d'origine (9h00 UTC)
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurer Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          # Installation des bibliothèques de base + ton fichier requirements.txt
          pip install requests beautifulsoup4
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Exécuter le script
        run: python motsrares/motsrares.py

      - name: Configurer l'identité Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit et Push des modifications
        run: |
          git add motsrares/indexmotsrares.txt
          # Vérifie s'il y a des changements avant de continuer
          if ! git diff --cached --exit-code; then
            git commit -m "🤖 Mots Rares: Mise à jour de l'index"
            # Évite l'erreur [rejected] en récupérant les changements distants
            git pull --rebase origin main
            git push origin main
          else
            echo "Aucun nouveau mot rare à indexer."
          fi
          
