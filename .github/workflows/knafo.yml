name: KnafoBot

on:
  schedule:
    # Lancement à 08:30 et 15:30 UTC (environ 9h30 et 16h30 en France)
    - cron: '30 8 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install tweepy

      - name: Run bot
        env:
          KNAFO_CONSUMER_KEY: ${{ secrets.KNAFO_CONSUMER_KEY }}
          KNAFO_CONSUMER_SECRET: ${{ secrets.KNAFO_CONSUMER_SECRET }}
          KNAFO_ACCESS_TOKEN: ${{ secrets.KNAFO_ACCESS_TOKEN }}
          KNAFO_ACCESS_TOKEN_SECRET: ${{ secrets.KNAFO_ACCESS_TOKEN_SECRET }}
        run: python knafo/knafo.py

      - name: Update Repository (Index)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. On récupère d'abord les changements distants sans rebaser immédiatement
          git fetch origin main
          
          # 2. On ajoute les changements faits par le script
          git add knafo/last_index.json
          
          # 3. On vérifie s'il y a quelque chose à commiter
          if ! git diff --cached --quiet; then
            # 4. On commit localement
            git commit -m "Update Knafo index [skip ci]"
            
            # 5. On fait le pull en disant à Git de privilégier NOTRE version (ours) en cas de conflit
            # Note: Avec un rebase, "ours" (le nôtre) désigne en réalité le commit qu'on est en train d'appliquer.
            git pull --rebase -X theirs origin main
            
            # 6. On pousse le tout
            git push
          else
            echo "Aucune modification à sauvegarder."
          fi
