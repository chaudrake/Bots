        name: Aperobot - Tweet Quotidien

on:
  schedule:
    # S'exécute tous les jours à 18:30 (Heure UTC)
    - cron: '30 18 * * *'
  workflow_dispatch: # Permet de lancer le bot manuellement depuis l'onglet Actions

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install tweepy

      - name: Lancer Aperobot
        env:
          # Ces noms à gauche (ex: CONSUMER_KEY) doivent correspondre à os.getenv() dans ton .py
          # Les noms à droite (ex: secrets.CONSUMER_KEY) doivent être identiques dans tes Secrets GitHub
          CONSUMER_KEY: ${{ secrets.CONSUMER_KEY }}
          CONSUMER_SECRET: ${{ secrets.CONSUMER_SECRET }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
        run: python aperobot/aperobot.py
        
