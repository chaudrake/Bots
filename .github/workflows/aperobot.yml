name: Aperobot - Tweet Quotidien

on:
  schedule:
    # '*/30' = toutes les 30 minutes
    # '5-21' = de 5h du matin à 21h inclus
    # Les heures sont en UTC/GMT
    - cron: '*/30 5-21 * * *'
  workflow_dispatch: # Permet de lancer le bot manuellement depuis l'onglet Actions

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install tweepy pytz

      - name: Lancer Aperobot
        env:
          # Correspondance exacte avec ton script Python os.getenv()
          APEROBOT_CONSUMER_KEY: ${{ secrets.APEROBOT_CONSUMER_KEY }}
          APEROBOT_CONSUMER_SECRET: ${{ secrets.APEROBOT_CONSUMER_SECRET }}
          APEROBOT_ACCESS_KEY: ${{ secrets.APEROBOT_ACCESS_KEY }}
          APEROBOT_ACCESS_SECRET: ${{ secrets.APEROBOT_ACCESS_SECRET }}
        run: python aperobot/aperobot.py
        
