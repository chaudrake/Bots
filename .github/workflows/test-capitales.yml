name: Capitales Bot

on:
workflow_dispatch:   # permet de lancer à la main
schedule:
- cron: "0 9 * * *"   # tous les jours à 09h UTC (11h en France été)

jobs:
run-bot:
runs-on: ubuntu-latest

```
steps:
  # 1. Récupère le repo
  - name: Checkout repository
    uses: actions/checkout@v3

  # 2. Installe Python
  - name: Setup Python
    uses: actions/setup-python@v4
    with:
      python-version: "3.10"

  # 3. Installe les dépendances
  - name: Install dependencies
    run: pip install -r capitales/requirements.txt

  # 4. (Optionnel) Debug pour voir les fichiers
  - name: Debug files
    run: |
      echo "Current directory:"
      pwd
      echo "Tree:"
      ls -R

  # 5. Lance le bot
  - name: Run bot
    working-directory: capitales
    run: python capitales.py
    env:
      CAPITALES_CONSUMER_KEY: ${{ secrets.CAPITALES_CONSUMER_KEY }}
      CAPITALES_CONSUMER_SECRET: ${{ secrets.CAPITALES_CONSUMER_SECRET }}
      CAPITALES_ACCESS_TOKEN: ${{ secrets.CAPITALES_ACCESS_TOKEN }}
      CAPITALES_ACCESS_TOKEN_SECRET: ${{ secrets.CAPITALES_ACCESS_TOKEN_SECRET }}
```
