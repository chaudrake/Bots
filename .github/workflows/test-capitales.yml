name: Exécuter le script des capitales

on:
  workflow_dispatch:  # Déclenchement manuel
  # push:
  #   branches: [ main ]  # Décommente si tu veux auto au push

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run capitales.py
        env:
          # Les 4 secrets deviennent des variables d'environnement
          CAPITALES_ACCESS_TOKEN: ${{ secrets.CAPITALES_ACCESS_TOKEN }}
          CAPITALES_ACCESS_TOKEN_SECRET: ${{ secrets.CAPITALES_ACCESS_TOKEN_SECRET }}
          CAPITALES_CONSUMER_KEY: ${{ secrets.CAPITALES_CONSUMER_KEY }}
          CAPITALES_CONSUMER_SECRET: ${{ secrets.CAPITALES_CONSUMER_SECRET }}
        run: python capitales/capitales.py
