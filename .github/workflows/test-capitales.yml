name: Exécuter le script des capitales

on:
  workflow_dispatch:  # Déclenchement manuel

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install tracery (specific)
        run: |
          pip install tracery
          python -c "import tracery; print('✅ tracery installed successfully')"

      - name: Install other dependencies
        run: |
          pip install tweepy colorama requests

      - name: Debug file structure
        run: |
          echo "=== Contenu de la racine ==="
          ls -la
          echo "=== Contenu de capitales/ ==="
          ls -la capitales/ || echo "Dossier capitales n'existe pas"
          echo "=== Chemin complet ==="
          pwd
          echo "=== Recherche de bot.json ==="
          find . -name "bot.json" -type f

      - name: Run capitales.py
        env:
          CAPITALES_ACCESS_TOKEN: ${{ secrets.CAPITALES_ACCESS_TOKEN }}
          CAPITALES_ACCESS_TOKEN_SECRET: ${{ secrets.CAPITALES_ACCESS_TOKEN_SECRET }}
          CAPITALES_CONSUMER_KEY: ${{ secrets.CAPITALES_CONSUMER_KEY }}
          CAPITALES_CONSUMER_SECRET: ${{ secrets.CAPITALES_CONSUMER_SECRET }}
        run: python capitales/capitales.py
