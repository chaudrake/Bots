name: Exécuter le script des capitales

on:
  # Déclenchement manuel depuis l'onglet Actions de GitHub
  workflow_dispatch:
  # Déclenchement automatique à chaque nouveau commit (si tu veux)
  # push:
  #   branches: [ main ]

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupère le code de ton repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Installe Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 3. Installe les dépendances (si tu as un fichier requirements.txt)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Exécute ton script et lui passe les secrets en variables d'environnement
      - name: Run capitales.py
        env:
          # Ici, on relie le secret GitHub à une variable d'environnement
          MON_IDENTIFIANT: ${{ secrets.NOM_DU_SECRET }} # Remplace par le nom que tu as donné
          MON_AUTRE_SECRET: ${{ secrets.NOM_DU_SECRET_2 }}
        run: python capitales/capitales.py
