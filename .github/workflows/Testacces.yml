name: Traitement des maires

on:
  workflow_dispatch:
    inputs:
      fichier_entree:
        description: 'Nom du fichier CSV source'
        required: false
        default: 'elus-maires-mai.csv'
        type: string
      fichier_sortie:
        description: 'Nom du fichier CSV de sortie'
        required: false
        default: 'elus-maires-mai-corrige.csv'
        type: string

jobs:
  corriger-encodage:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      
      - name: Lister tous les fichiers (debug)
        run: |
          echo "=== Structure complète ==="
          ls -la
          echo "=== Dossier maires ==="
          ls -la maires/ 2>/dev/null || echo "Dossier maires inexistant"
          echo "=== Racine ==="
          ls -la *.py 2>/dev/null || echo "Aucun .py à la racine"
      
      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Mise à jour de pip
        run: |
          python -m pip install --upgrade pip
      
      - name: Installation des dépendances
        run: |
          pip install pandas numpy
      
      - name: Exécution du script
        run: |
          # Alternative : chercher le script partout
          if [ -f "maires/miseenformeducsv.py" ]; then
            cd maires
            python miseenformeducsv.py "${{ github.event.inputs.fichier_entree }}" "${{ github.event.inputs.fichier_sortie }}"
          elif [ -f "miseenformeducsv.py" ]; then
            python miseenformeducsv.py "${{ github.event.inputs.fichier_entree }}" "${{ github.event.inputs.fichier_sortie }}"
          else
            echo "❌ Script introuvable !"
            find . -name "*.py" -type f
            exit 1
          fi
      
      - name: Commit et push du fichier corrigé
        run: |
          # Chercher le fichier de sortie partout
          if [ -f "maires/${{ github.event.inputs.fichier_sortie }}" ]; then
            cd maires
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ github.event.inputs.fichier_sortie }}" || git add "*/${{ github.event.inputs.fichier_sortie }}"
          git status
          git commit -m "Mise à jour auto: ${{ github.event.inputs.fichier_sortie }} [skip ci]" || echo "Aucun changement à committer"
          git push
