name: Sunbot Execution

on:
  schedule:
    # Chaque heure de 6h15 à 20h15 UTC
    - cron: '15 6-20 * * *'
  workflow_dispatch: # Permet de le lancer manuellement pour tester

jobs:
  run-sunbot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tweepy requests Pillow

      - name: Run Sunbot
        env:
          SUNBOT_CONSUMER_KEY: ${{ secrets.SUNBOT_CONSUMER_KEY }}
          SUNBOT_CONSUMER_SECRET: ${{ secrets.SUNBOT_CONSUMER_SECRET }}
          SUNBOT_ACCESS_KEY: ${{ secrets.SUNBOT_ACCESS_KEY }}
          SUNBOT_ACCESS_SECRET: ${{ secrets.SUNBOT_ACCESS_SECRET }}
          SUNBOT_UNSPLASH_ACCESS_KEY: ${{ secrets.SUNBOT_UNSPLASH_ACCESS_KEY }}
        run: python sunbot/sunbot.py
