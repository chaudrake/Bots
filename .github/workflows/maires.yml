name: Twitter Bot - Maires

on:
  schedule:
    - cron: '0 8,11,14,17,20 * * *'
    - cron: '30 9,12,15,18 * * *'
  workflow_dispatch:

jobs:
  post-tweet:
    runs-on: ubuntu-latest
    concurrency:
      group: twitter-bot-maires
      cancel-in-progress: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas tweepy python-dotenv
      
      - name: Download previous data
        uses: dawidd6/action-download-artifact@v3
        continue-on-error: true
        with:
          name: maires-bot-data
          path: ./maires/
          if_no_artifact_found: warn
      
      - name: Post tweet
        working-directory: ./maires
        env:
          QUIESTLEMAIRE_ACCESS_KEY: ${{ secrets.QUIESTLEMAIRE_ACCESS_KEY }}
          QUIESTLEMAIRE_ACCESS_SECRET: ${{ secrets.QUIESTLEMAIRE_ACCESS_SECRET }}
          QUIESTLEMAIRE_CONSUMER_KEY: ${{ secrets.QUIESTLEMAIRE_CONSUMER_KEY }}
          QUIESTLEMAIRE_CONSUMER_SECRET: ${{ secrets.QUIESTLEMAIRE_CONSUMER_SECRET }}
        run: python maires.py
      
      - name: Upload updated data
        uses: actions/upload-artifact@v4
        with:
          name: maires-bot-data
          path: |
            maires/tweeted_maires.txt
            maires/log.log
          retention-days: 90
          overwrite: true
