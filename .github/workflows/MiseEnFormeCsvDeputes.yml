name: Traitement des députés

on:
  workflow_dispatch:

jobs:
  corriger-encodage:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
      
      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Installation des dépendances
        run: |
          pip install pandas numpy
      
      - name: Exécution du script
        run: |
          cd deputes
          python miseenformeducsv.py
          
          echo "=== Vérification des dates corrigées ==="
          head -3 elus-deputes-depCorrige.csv | cut -d';' -f2,6,7,8,9
      
      - name: Commit et push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Correction des dates au format JJ/MM/AAAA [skip ci]"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          file_pattern: "deputes/elus-deputes-depCorrige.csv"
          add_options: "--force"
          push_options: "--force-with-lease"
