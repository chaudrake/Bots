name: Traitement des députés

on:
  workflow_dispatch:
    inputs:
      fichier_entree:
        description: 'Nom du fichier CSV source'
        required: false
        default: 'elus-deputes-dep.csv'
        type: string
      fichier_sortie:
        description: 'Nom du fichier CSV de sortie'
        required: false
        default: 'elus-deputes-depCorrige.csv'
        type: string

jobs:
  corriger-encodage:
    runs-on: ubuntu-latest
    
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4
      
      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Mise à jour de pip
        run: |
          python -m pip install --upgrade pip
      
      - name: Installation des dépendances
        run: |
          pip install pandas numpy
      
      - name: Exécution du script
        run: |
          cd deputes
          if [ -z "${{ github.event.inputs.fichier_entree }}" ]; then
            python miseenformeducsv.py
          else
            python miseenformeducsv.py "${{ github.event.inputs.fichier_entree }}" "${{ github.event.inputs.fichier_sortie }}"
          fi
      
      - name: Upload du fichier corrigé
        uses: actions/upload-artifact@v4
        with:
          name: fichier-corrige
          path: deputes/elus-deputes-depCorrige.csv
          retention-days: 30
