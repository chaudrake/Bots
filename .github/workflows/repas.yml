name: Repas Bot

on:
  workflow_dispatch:
  schedule:
    # Crons calés sur l'heure d'été (UTC+2)
    # 4h UTC → 6h FR | 9h UTC → 11h FR | 16h UTC → 18h FR
    - cron: "0 4 * * *"
    - cron: "0 9 * * *"
    - cron: "0 16 * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # INDISPENSABLE : Autorise la mise à jour du fichier de suivi (meal_state.json)
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          cd repas
          pip install tweepy pytz

      - name: Run bot
        run: |
          cd repas
          python repas.py
        env:
          REPAS_CONSUMER_KEY: ${{ secrets.REPAS_CONSUMER_KEY }}
          REPAS_CONSUMER_SECRET: ${{ secrets.REPAS_CONSUMER_SECRET }}
          REPAS_ACCESS_KEY: ${{ secrets.REPAS_ACCESS_KEY }}
          REPAS_ACCESS_SECRET: ${{ secrets.REPAS_ACCESS_SECRET }}

      - name: Save state update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # On ajoute le fichier JSON de suivi
          git add repas/meal_state.json
          # On ne commit que s'il y a eu un changement d'état
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Repas: Mise à jour de l'état du cycle alimentaire" && git push)
          
