name: Repas Bot

on:
  workflow_dispatch:
  schedule:
    # Crons calés sur l'heure d'été (UTC+2)
    - cron: "0 4 * * *"     # 4h UTC → 6h FR (été) / attend 1h → 6h FR (hiver)
    - cron: "0 9 * * *"     # 9h UTC → 11h FR (été) / attend 1h → 11h FR (hiver)
    - cron: "0 16 * * *"    # 16h UTC → 18h FR (été) / attend 1h → 18h FR (hiver)

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          cd repas
          pip install tweepy pytz

      - name: Run bot
        run: |
          cd repas
          python repas.py
        env:
          REPAS_CONSUMER_KEY: ${{ secrets.REPAS_CONSUMER_KEY }}
          REPAS_CONSUMER_SECRET: ${{ secrets.REPAS_CONSUMER_SECRET }}
          REPAS_ACCESS_KEY: ${{ secrets.REPAS_ACCESS_KEY }}
          REPAS_ACCESS_SECRET: ${{ secrets.REPAS_ACCESS_SECRET }}
