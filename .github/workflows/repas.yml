name: Repas Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"     # 4h UTC → 6h FR (été) / 5h FR (hiver)
    - cron: "0 9 * * *"     # 9h UTC → 11h FR (été) / 10h FR (hiver)
    - cron: "0 16 * * *"    # 16h UTC → 18h FR (été) / 17h FR (hiver)

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          cd repas
          pip install tweepy pytz
      - name: Run bot
        run: |
          cd repas
          python repas.py
        env:
          REPAS_CONSUMER_KEY: ${{ secrets.REPAS_CONSUMER_KEY }}
          REPAS_CONSUMER_SECRET: ${{ secrets.REPAS_CONSUMER_SECRET }}
          REPAS_ACCESS_KEY: ${{ secrets.REPAS_ACCESS_KEY }}
          REPAS_ACCESS_SECRET: ${{ secrets.REPAS_ACCESS_SECRET }}
