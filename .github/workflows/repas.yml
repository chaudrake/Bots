# Lancé par cron-job.org
name: Repas Bot

on:
  workflow_dispatch:
 # schedule:
    # Crons calés sur l'heure d'été (UTC+2)
    # 4h UTC → 6h FR | 9h UTC → 11h FR | 16h UTC → 18h FR
 #   - cron: "11 4 * * *"
  #  - cron: "11 9 * * *"
  #  - cron: "19 15 * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # INDISPENSABLE : Autorise la mise à jour du fichier de suivi (meal_state.json)
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          cd repas
          pip install tweepy pytz

      - name: Run bot
        run: |
          cd repas
          python repas.py
        env:
          REPAS_CONSUMER_KEY: ${{ secrets.REPAS_CONSUMER_KEY }}
          REPAS_CONSUMER_SECRET: ${{ secrets.REPAS_CONSUMER_SECRET }}
          REPAS_ACCESS_KEY: ${{ secrets.REPAS_ACCESS_KEY }}
          REPAS_ACCESS_SECRET: ${{ secrets.REPAS_ACCESS_SECRET }}

      - name: Save index update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          BACKUP_FILE="/tmp/index_backup_${{ github.run_id }}.json"
          MAX_RETRIES=3
          RETRY_COUNT=0
          SUCCESS=false

          while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$SUCCESS" = false ]; do
            echo "Tentative $((RETRY_COUNT+1)) sur $MAX_RETRIES..."

            if [ -f repas/meal_state.json ]; then
              cp repas/meal_state.json "$BACKUP_FILE"
            fi

            git fetch origin main
            git reset --hard origin/main

            if [ -f "$BACKUP_FILE" ]; then
              cp "$BACKUP_FILE" repas/meal_state.json
            fi

            git add repas/meal_state.json
            if git diff --quiet --cached; then
              echo "Aucun changement à committer"
              SUCCESS=true
            else
              if git commit -m "🤖 Repas : Mise à jour de l'index"; then
                if git push origin main; then
                  echo "Commit et push réussis"
                  SUCCESS=true
                else
                  echo "Push échoué, tentative de récupération..."
                  git pull --rebase origin main
                  RETRY_COUNT=$((RETRY_COUNT+1))
                  if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                    echo "Attente de 60 secondes avant nouvelle tentative..."
                    sleep 60
                  fi
                fi
              else
                echo "Commit échoué (pas de changement?)"
                SUCCESS=true
              fi
            fi
          done

          if [ "$SUCCESS" = false ]; then
            echo "❌ Échec après $MAX_RETRIES tentatives"
            exit 1
          fi
