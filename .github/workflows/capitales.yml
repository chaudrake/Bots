name: Capitales Bot

on:
  workflow_dispatch:
  schedule:
    # Tous les jours à 09h et 15h UTC
    - cron: "0 9 * * *"
    - cron: "0 15 * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # INDISPENSABLE : Permet au bot de mettre à jour le fichier index.json
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt

      - name: Run bot
        run: |
          cd capitales
          python capitales.py
        env:
          CAPITALES_CONSUMER_KEY: ${{ secrets.CAPITALES_CONSUMER_KEY }}
          CAPITALES_CONSUMER_SECRET: ${{ secrets.CAPITALES_CONSUMER_SECRET }}
          CAPITALES_ACCESS_TOKEN: ${{ secrets.CAPITALES_ACCESS_TOKEN }}
          CAPITALES_ACCESS_TOKEN_SECRET: ${{ secrets.CAPITALES_ACCESS_TOKEN_SECRET }}

      - name: Save index update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # On ajoute l'index JSON situé dans le dossier capitales
          git add capitales/index.json
          # On commit et on push seulement si le fichier a été modifié
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Capitales: Mise à jour de l'index des cités tweetées" && git push)
          
