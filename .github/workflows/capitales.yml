name: Capitales Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "10 15 * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt

      - name: Run bot
        run: |
          cd capitales
          python capitales.py
        env:
          CAPITALES_CONSUMER_KEY: ${{ secrets.CAPITALES_CONSUMER_KEY }}
          CAPITALES_CONSUMER_SECRET: ${{ secrets.CAPITALES_CONSUMER_SECRET }}
          CAPITALES_ACCESS_TOKEN: ${{ secrets.CAPITALES_ACCESS_TOKEN }}
          CAPITALES_ACCESS_TOKEN_SECRET: ${{ secrets.CAPITALES_ACCESS_TOKEN_SECRET }}

      - name: Save index update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          MAX_RETRIES=3
          RETRY_COUNT=0
          SUCCESS=false
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$SUCCESS" = false ]; do
            echo "Tentative $((RETRY_COUNT+1)) sur $MAX_RETRIES..."
            
            if [ -f capitales/index.json ]; then
              cp capitales/index.json /tmp/index_backup.json
            fi
            
            git fetch origin main
            git reset --hard origin/main
            
            if [ -f /tmp/index_backup.json ]; then
              cp /tmp/index_backup.json capitales/index.json
            fi
            
            git add capitales/index.json
            if git diff --quiet --cached; then
              echo "Aucun changement à committer"
              SUCCESS=true
            else
              if git commit -m "🤖 Capitales: Mise à jour de l'index"; then
                if git push origin main; then
                  echo "Commit et push réussis"
                  SUCCESS=true
                else
                  echo "Push échoué, tentative de récupération..."
                  git pull --rebase origin main
                  RETRY_COUNT=$((RETRY_COUNT+1))
                  if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                    echo "Attente de 60 secondes avant nouvelle tentative..."
                    sleep 60
                  fi
                fi
              else
                echo "Commit échoué (pas de changement?)"
                SUCCESS=true
              fi
            fi
          done
          
          if [ "$SUCCESS" = false ]; then
            echo "❌ Échec après $MAX_RETRIES tentatives"
            exit 1
          fi
