name: Capitales Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"
    - cron: "0 15 * * *"
  push:
    paths:
      - 'capitales/**'    # Ne se déclenche que pour les modifs dans ce dossier
      - '.github/workflows/capitales.yml' # Ou si on modifie le workflow lui-même


jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # INDISPENSABLE : Permet au bot de mettre à jour le fichier index.json
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt

      - name: Run bot
        run: |
          cd capitales
          python capitales.py
        env:
          CAPITALES_CONSUMER_KEY: ${{ secrets.CAPITALES_CONSUMER_KEY }}
          CAPITALES_CONSUMER_SECRET: ${{ secrets.CAPITALES_CONSUMER_SECRET }}
          CAPITALES_ACCESS_TOKEN: ${{ secrets.CAPITALES_ACCESS_TOKEN }}
          CAPITALES_ACCESS_TOKEN_SECRET: ${{ secrets.CAPITALES_ACCESS_TOKEN_SECRET }}

      - name: Save index update
  run: |
    git config --global user.name "github-actions[bot]"
    git config --global user.email "github-actions[bot]@users.noreply.github.com"
    
    # Sauvegarder le fichier local si modifié
    if [ -f capitales/index.json ]; then
      cp capitales/index.json /tmp/index_backup.json
    fi
    
    # Récupérer les dernières modifications
    git fetch origin main
    git reset --hard origin/main
    
    # Restaurer notre version modifiée
    if [ -f /tmp/index_backup.json ]; then
      cp /tmp/index_backup.json capitales/index.json
    fi
    
    # Ajouter, committer et pousser
    git add capitales/index.json
    if ! git diff --quiet --cached; then
      git commit -m "🤖 Capitales: Mise à jour de l'index des cités tweetées"
      git push origin main
    fi
