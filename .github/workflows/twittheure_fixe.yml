name: TwittHeure - Heures Fixes

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * *"   # 00:00 FR (été)
    - cron: "0 23 * * *"   # 00:00 FR (hiver)
    - cron: "11 9 * * *"   # 11:11 FR (été)
    - cron: "11 10 * * *"  # 11:11 FR (hiver)
    - cron: "22 20 * * *"  # 22:22 FR (été)
    - cron: "22 21 * * *"  # 22:22 FR (hiver)

jobs:
  run-bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Bots/twittheure # Définit le dossier par défaut pour toutes les étapes
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install tweepy pytz
      - name: Run fixed hours
        run: python twittheure_fixe.py
        env:
          THeure_CONSUMER_KEY: ${{ secrets.THEURE_CONSUMER_KEY }}
          THeure_CONSUMER_SECRET: ${{ secrets.THEURE_CONSUMER_SECRET }}
          THeure_ACCESS_KEY: ${{ secrets.THEURE_ACCESS_KEY }}
          THeure_ACCESS_SECRET: ${{ secrets.THEURE_ACCESS_SECRET }}
          
