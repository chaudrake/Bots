name: TwittHeure - Heures Fixes

on:
  workflow_dispatch:
  schedule:
    # Les crons s'exécutent en UTC (heure du serveur GitHub)
    # On se déclenche suffisamment tôt pour avoir le temps d'attendre jusqu'à l'heure cible
    # Les marges sont larges (30-60 min avant l'heure cible)
    
    # Pour 00:00 (heure française) - Cron à 22:30 UTC (soit 23:30 FR hiver / 00:30 FR été)
    - cron: "30 21 * * *"
    
    # Pour 11:11 (heure française) - Cron à 9:30 UTC (soit 10:30 FR hiver / 11:30 FR été)
    - cron: "30 8 * * *"
    
    # Pour 22:22 (heure française) - Cron à 20:30 UTC (soit 21:30 FR hiver / 22:30 FR été)
    - cron: "0 20 * * *"

jobs:
  run-bot-00h00:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          cd twittheure
          pip install tweepy pytz
      - name: Run bot for 00:00
        run: |
          cd twittheure
          python twittheure_fixe.py
        env:
          TARGET_HOUR: "0"
          TARGET_MINUTE: "0"
          THeure_CONSUMER_KEY: ${{ secrets.THEURE_CONSUMER_KEY }}
          THeure_CONSUMER_SECRET: ${{ secrets.THEURE_CONSUMER_SECRET }}
          THeure_ACCESS_KEY: ${{ secrets.THEURE_ACCESS_KEY }}
          THeure_ACCESS_SECRET: ${{ secrets.THEURE_ACCESS_SECRET }}

  run-bot-11h11:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          cd twittheure
          pip install tweepy pytz
      - name: Run bot for 11:11
        run: |
          cd twittheure
          python twittheure_fixe.py
        env:
          TARGET_HOUR: "11"
          TARGET_MINUTE: "11"
          THeure_CONSUMER_KEY: ${{ secrets.THEURE_CONSUMER_KEY }}
          THeure_CONSUMER_SECRET: ${{ secrets.THEURE_CONSUMER_SECRET }}
          THeure_ACCESS_KEY: ${{ secrets.THEURE_ACCESS_KEY }}
          THeure_ACCESS_SECRET: ${{ secrets.THEURE_ACCESS_SECRET }}

  run-bot-22h22:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          cd twittheure
          pip install tweepy pytz
      - name: Run bot for 22:22
        run: |
          cd twittheure
          python twittheure_fixe.py
        env:
          TARGET_HOUR: "22"
          TARGET_MINUTE: "22"
          THeure_CONSUMER_KEY: ${{ secrets.THEURE_CONSUMER_KEY }}
          THeure_CONSUMER_SECRET: ${{ secrets.THEURE_CONSUMER_SECRET }}
          THeure_ACCESS_KEY: ${{ secrets.THEURE_ACCESS_KEY }}
          THeure_ACCESS_SECRET: ${{ secrets.THEURE_ACCESS_SECRET }}
