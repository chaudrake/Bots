name: TwittHeure - Heures Fixes

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"        # 00:00 UTC (02h France été)
    - cron: "11 11 * * *"      # 11:11 UTC (13h11 France été)
    - cron: "22 22 * * *"      # 22:22 UTC (00h22 France été)

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install tweepy pytz
      - name: Run fixed hours
        run: |
          cd twittheure
          python twittheure_fixe.py
        env:
          THeure_CONSUMER_KEY: ${{ secrets.THEURE_CONSUMER_KEY }}
          THeure_CONSUMER_SECRET: ${{ secrets.THEURE_CONSUMER_SECRET }}
          THeure_ACCESS_KEY: ${{ secrets.THEURE_ACCESS_KEY }}
          THeure_ACCESS_SECRET: ${{ secrets.THEURE_ACCESS_SECRET }}
