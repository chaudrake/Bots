name: TwittHeure Bot

on:
  workflow_dispatch:
  schedule:
    # Heures fixes
    - cron: "0 0 * * *"        # 00h00 UTC (02h00 France été / 01h00 France hiver)
    - cron: "11 11 * * *"      # 11h11 UTC (13h11 France été / 12h11 France hiver)
    - cron: "22 22 * * *"      # 22h22 UTC (00h22 France été / 23h22 France hiver)
    # Heures aléatoires : toutes les 10 minutes entre 6h et 21h UTC
    - cron: "*/10 6-21 * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          cd twittheure
          pip install tweepy pytz

      - name: Debug files
        run: |
          echo "=== twittheure directory content ==="
          ls -la twittheure/
          echo "=== Check bot.json ==="
          cat twittheure/bot.json | head -10

      - name: Run bot
        run: |
          cd twittheure
          python twittheure.py
        env:
          THeure_CONSUMER_KEY: ${{ secrets.THEURE_CONSUMER_KEY }}
          THeure_CONSUMER_SECRET: ${{ secrets.THEURE_CONSUMER_SECRET }}
          THeure_ACCESS_KEY: ${{ secrets.THEURE_ACCESS_KEY }}
          THeure_ACCESS_SECRET: ${{ secrets.THEURE_ACCESS_SECRET }}
