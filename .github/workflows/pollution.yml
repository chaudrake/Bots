name: Pollution Bot

on:
  workflow_dispatch:
  schedule:
    # Crons calés sur l'heure d'été (UTC+2)
    # 8h France → 6h UTC
    # 12h France → 10h UTC
    # 18h France → 16h UTC
    - cron: "0 6 * * *"     # 6h UTC → 8h France (été) / 7h France (hiver)
    - cron: "0 10 * * *"    # 10h UTC → 12h France (été) / 11h France (hiver)
    - cron: "0 16 * * *"    # 16h UTC → 18h France (été) / 17h France (hiver)

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          cd pollution
          pip install tweepy requests pytz

      - name: Run bot
        run: |
          cd pollution
          python pollution.py
        env:
          POLLUTION_CONSUMER_KEY: ${{ secrets.POLLUTION_CONSUMER_KEY }}
          POLLUTION_CONSUMER_SECRET: ${{ secrets.POLLUTION_CONSUMER_SECRET }}
          POLLUTION_ACCESS_KEY: ${{ secrets.POLLUTION_ACCESS_KEY }}
          POLLUTION_ACCESS_SECRET: ${{ secrets.POLLUTION_ACCESS_SECRET }}
          POLLUTION_AIRVISUAL_API_KEY: ${{ secrets.POLLUTION_AIRVISUAL_API_KEY }}
