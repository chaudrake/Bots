name: Backup to Google Drive

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"   # tous les jours à 03h00 UTC

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install pydrive2 PyDrive oauth2client

      - name: Setup Google Drive config
        run: |
          # Créer settings.yaml
          echo "${{ secrets.GOOGLE_SETTINGS_YAML }}" > settings.yaml
          
          # Créer credentials.json (temporaire)
          echo "${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}" > credentials.json

      - name: Run backup script
        run: |
          # Copier le script dans le répertoire courant
          cp .github/workflows/sauvegardesurdrive.py .
          python sauvegardesurdrive.py
        env:
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}

      - name: Cleanup
        run: |
          rm -f credentials.json
          rm -f settings.yaml
